[General]
; Master switch for all SkyGfx effects.
; 1 = enabled
; 0 = disabled (game renders as stock)
Enabled=1
; Log verbosity written to logcat (tag SkyGfx). Applies live.
; 0 = errors and startup only
; 1 = info
; 2 = verbose
Log=0

[ColourFilter]
; PS2-style colour filter applied over the final image.
; 1 = on
; 0 = off
PS2Filter=1
; Strength of the colour filter. 0 = none, 1 = full.
Strength=1.0
; How strongly the game's own timecycle grading is kept under the filter. 0 = none, 1 = full.
GameTimecycStrength=0.4
; How much of the original brightness is kept when the filter darkens the image. 0 = none, 1 = full.
KeepBrightness=0.5

[Grade]
; Colour saturation. 1.0 = unchanged.
Saturation=1.2
; Colour contrast. 1.0 = unchanged.
Contrast=1.0

[Atmosphere]
; Sky and fog model.
; 0 = classic sky
; 1 = GTA fog
; 2 = modern
Mode=0
; Distance of the fog. Larger values push fog further away.
FogDistance=1.8
; Opacity of the fog. 0 = clear, 1 = opaque.
FogOpacity=0.5
; Haze strength around the horizon. 0 = none, 1 = strong.
Haze=0.4
; Haze strength near the ground. 0 = none, 1 = strong.
GroundHaze=0.0

[Colours]
; Sky colour multiplier. 1.0 = default.
Sky=1.0
; Fog colour multiplier. 1.0 = default.
Fog=1.0
; Ambient light level. 0 = none, 1 = full.
Ambient=0.3
; Sun colour multiplier. 1.0 = default.
Sun=0.4
; Cloud colour multiplier. 1.0 = default.
Clouds=0.5
; Overall brightness. 1.0 = default.
Brightness=1.0
; Exposure adjustment at night. Negative values darken, positive values brighten.
NightExposure=-0.5

[Shadows]
; Darkness of shadows. 0 = none, 1 = full.
Darkness=0.5

[Timecyc]
; Which timecycle colour table is used.
; 1 = PS2 table
; 0 = game table
PS2Timecyc=1

[Radiosity]
; Light bounce from surfaces onto nearby geometry.
; 1 = on
; 0 = off
Radiosity=1
; Strength of the radiosity effect. Higher values are brighter.
Intensity=35
; How much bloom is removed from the radiosity effect. 0 = none, 1 = full.
DEBloom=0.0

[Grain]
; Film grain overlay.
; 1 = on
; 0 = off
Grain=1
; Strength of the grain. 0 = none, 1 = full.
GrainStrength=1.0

[SpeedFX]
; Speed blur effect when moving fast.
; 1 = on
; 0 = off
SpeedFX=1
; Forces the speed blur on for testing.
; 1 = always on
; 0 = normal behaviour
TestMode=0

[StreetLights]
; Distance at which street lights are drawn, in decametres.
DrawDistanceDm=15
; Distance at which street light shadows are drawn, in decametres.
ShadowDistanceDm=2
; Whether other light sources cast shadows.
; 1 = yes
; 0 = no
OtherLightShadows=0
; Brightness of bollard lights. 0 = off, 1 = full.
BollardBrightness=0.5
; Brightness of globe lamps. Higher values are brighter.
GlobeLampBrightness=8

[Corona]
; Glow around light sources.
; 1 = on
; 0 = off
Enabled=1
; Size of the glow. 0 = none, 1 = full.
Size=0.5
; Brightness of the glow. 0 = none, 1 = full.
Intensity=1.0
; Distance at which the glow stops drawing, in decametres. 0 = automatic.
FarClipDm=0

[World]
; Level-of-detail distance multiplier. Higher values draw distant objects at higher detail.
LodDistance=1.8

[ModernLook]
; Only takes effect on devices with feature level 3.
; Screen-space global illumination.
; 1 = on
; 0 = off
SSGI=0
; Quality level of SSGI. Higher is better and costs more GPU time.
SSGIQuality=4
; Ambient occlusion.
; 1 = on
; 0 = off
AmbientOcclusion=0
; Screen-space reflections.
; 1 = on
; 0 = off
Reflections=0
; Quality level of reflections. Higher is better and costs more GPU time.
ReflectionQuality=4
; Volumetric fog.
; 1 = on
; 0 = off
VolumetricFog=0
; Lens flare from the sun.
; 1 = on
; 0 = off
LensFlare=1
; Strength of the sun effect. 0 = none, 1 = full.
SunStrength=1.0

[Debug]
; Forces a weather type. -1 = off, 0 to 22 = weather id.
ForceWeather=-1
; Second weather type to blend towards. -1 = off, 0 to 22 = weather id.
BlendWeatherB=-1
; Blend between weather A and weather B. 0 = A, 1 = B.
Blend=0.0
; Sets the hour once, then the game clock runs normally. -1 = off, 0 to 23 = hour.
SetHour=-1
; Sets the minute once, then the game clock runs normally. -1 = off, 0 to 59 = minute.
SetMinute=-1
; Stops the game clock.
; 1 = frozen
; 0 = normal
FreezeTime=0
; Speed of the game clock. 1.0 = normal.
TimeSpeed=1.0
; Fast-forwards the clock through the day.
; 1 = on
; 0 = off
Timelapse=0
; Lets the player move through walls.
; 1 = on
; 0 = off
Noclip=0
; Detaches the camera from the player.
; 1 = on
; 0 = off
Freecam=0
; Movement speed in noclip mode.
NoclipSpeed=15
; Movement speed in freecam mode.
FreecamSpeed=20
; Moves the player to the camera position once.
; 1 = move
; 0 = do nothing
MovePlayerToCamera=0
; Runs the on-device probes (writes diagnostics to logcat). Restart required.
; 1 = on
; 0 = off
Probes=0
